{# _user_filter.html — Reusable user filter dropdown for admin pages #}
{# Expects: filter_users (list of User), selected_user_id (int|None), filter_action (url string) #}

<div class="mb-6">
  <form method="GET" action="{{ filter_action }}" class="flex items-center gap-3">
    <label for="user_filter" class="text-sm font-medium text-gray-600 whitespace-nowrap">
      <svg class="inline-block w-4 h-4 mr-1 -mt-0.5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"/>
      </svg>
      Filter by User
    </label>
    <select
      id="user_filter"
      name="user_id"
      onchange="this.form.submit()"
      class="block w-full max-w-xs rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm text-gray-700 shadow-sm focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition"
    >
      <option value="">All Users</option>
      {% for u in filter_users %}
        <option value="{{ u.id }}" {% if selected_user_id == u.id %}selected{% endif %}>
          {{ u.email.split('@')[0] | title }}  ({{ u.role | title }})
        </option>
      {% endfor %}
    </select>
    {% if selected_user_id %}
      <a href="{{ filter_action }}" class="inline-flex items-center gap-1 text-xs font-medium text-red-500 hover:text-red-700 transition whitespace-nowrap">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
        Clear
      </a>
    {% endif %}
  </form>
</div>
