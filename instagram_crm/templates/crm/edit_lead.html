{% extends "base.html" %}
{% block title %}Edit @{{ lead.instagram_handle }} — Instagram CRM{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">

  <div class="flex items-center gap-3 mb-6">
    <a href="{{ url_for('crm.dashboard') }}" class="text-gray-400 hover:text-gray-700 transition-colors">← Back</a>
    <h1 class="text-2xl font-bold text-gray-900">Edit @{{ lead.instagram_handle }}</h1>
  </div>

  <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-6 md:p-8">
    <form method="POST" action="{{ url_for('crm.edit_lead', lead_id=lead.id) }}" class="space-y-5">

      <div>
        <label for="instagram_handle" class="block text-sm font-semibold text-gray-700 mb-1">
          Instagram Handle <span class="text-red-500">*</span>
        </label>
        <div class="flex">
          <span class="inline-flex items-center px-3 rounded-l-lg border border-r-0 border-gray-300 bg-gray-50 text-gray-500 text-sm">@</span>
          <input id="instagram_handle" name="instagram_handle" type="text" required
            value="{{ lead.instagram_handle }}"
            class="flex-1 px-4 py-2.5 rounded-r-lg border border-gray-300 text-sm
                   focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition" />
        </div>
      </div>

      <div>
        <label for="status" class="block text-sm font-semibold text-gray-700 mb-1">Status</label>
        <select id="status" name="status"
          class="w-full px-4 py-2.5 rounded-lg border border-gray-300 text-sm bg-white
                 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition">
          {% for s in statuses %}
          <option value="{{ s }}" {% if lead.status == s %}selected{% endif %}>{{ s.replace('_',' ').title() }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label for="last_contacted" class="block text-sm font-semibold text-gray-700 mb-1">Last Contacted</label>
          <input id="last_contacted" name="last_contacted" type="date"
            value="{{ lead.last_contacted.strftime('%Y-%m-%d') if lead.last_contacted else '' }}"
            class="w-full px-4 py-2.5 rounded-lg border border-gray-300 text-sm
                   focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition" />
        </div>
        <div>
          <label for="next_followup" class="block text-sm font-semibold text-gray-700 mb-1">Next Follow-up</label>
          <input id="next_followup" name="next_followup" type="date"
            value="{{ lead.next_followup.strftime('%Y-%m-%d') if lead.next_followup else '' }}"
            class="w-full px-4 py-2.5 rounded-lg border border-gray-300 text-sm
                   focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition" />
        </div>
      </div>

      <div>
        <label for="notes" class="block text-sm font-semibold text-gray-700 mb-1">Notes</label>
        <textarea id="notes" name="notes" rows="4"
          class="w-full px-4 py-2.5 rounded-lg border border-gray-300 text-sm
                 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent
                 transition resize-y placeholder-gray-400">{{ lead.notes or '' }}</textarea>
      </div>

      <div class="flex items-center gap-4 pt-2">
        <button type="submit"
          class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-6 py-2.5 rounded-lg text-sm transition-colors shadow-sm">
          Save Changes
        </button>
        <a href="{{ url_for('crm.dashboard') }}" class="text-gray-500 hover:text-gray-700 text-sm font-medium">Cancel</a>
      </div>

    </form>
  </div>
</div>
{% endblock %}
